name: Arduino Compile

on:
  push:
    paths:
      - "firmware/giga/**"
  pull_request:
    paths:
      - "firmware/giga/**"

jobs:
  compile-giga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:mbed_giga:giga
          sketch-paths: firmware/giga/main
          libraries: |
            - name: ArduinoBLE
            - name: DHT11
            - name: Adafruit BME280 Library
            - name: U8g2
